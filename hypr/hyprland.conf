# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# HYPRLAND CONFIG (Sintaxis Nativa hyprland.conf)
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --

# ------------------
# ---- MONITORS ----
# ------------------
# Monitor Master-G (left)
monitor = DP-2, 1920x1080@60, 0x0, 1

# Monitor Xiaomi (Center)
monitor = HDMI-A-2, 1920x1080@200, 1920x0, 1

# Laptop (right)
monitor = eDP-1, 1920x1080@144, 3840x0, 1.5

# ---------------------
# ---- MY PROGRAMS ----
# ---------------------
$terminal = ghostty
$fileManager = nautilus
$menu = wofi --show drun


# -------------------
# ---- AUTOSTART ----
# -------------------
exec-once = swaybg -i /home/dmxs/Img/wall.jpg -m fill
#exec-once = nm-applet
exec-once = waybar


# -------------------------------
# ---- ENVIRONMENT VARIABLES ----
# -------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


# -----------------------
# ---- LOOK AND FEEL ----
# -----------------------
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = 0xee1a1a1a
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, default
    animation = windowsIn, 1, 4.1, default
    animation = windowsOut, 1, 1.49, linear
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint
    animation = layersOut, 1, 1.5, linear
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = zoomFactor, 1, 7, quick
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


# ---------------
# ---- INPUT ----
# ---------------
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

#gestures {
 #   workspace_swipe = true
#}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


# ---------------------
# ---- KEYBINDINGS ----
# ---------------------
$mainMod = SUPER

# launch programs main
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# move foco arrow
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# change area of work (Workspaces 1-3)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3

# move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3

#change of space use super + mouse small whell 
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

#navegation and creation of workspaces (gnome style)
bind = $mainMod, Right, workspace, m+1
bind = $mainMod, Left, workspace, m-1
bind = $mainMod, N, workspace, empty


#-------------------------------
#------- SCREENSHOTS -----------
#-------------------------------

#selection a area and open the editor swappy
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
#capture screenshots of screen and save img.png
bind = $mainMod, Print, exec, grim ~/Img/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png
#selection a area and copy in clipboard
	bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy


# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll entre áreas de trabajo
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mover/reorganizar ventanas con clic mouse + arrastrar
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Teclas multimedia / Brillo
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Teclas de reproducción (Playerctl)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


# --------------------------------
# ---- WINDOWS AND WORKSPACES ----
# --------------------------------
windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_focus 1
windowrule = match:class hyprland-run, move 20 monitor_h-120
windowrule = match:class hyprland-run, float 1

# configuration windowrule btop
windowrule = match:class ^(btop)$, float on
windowrule = match:class ^(btop)$, size 900 600
winodwrule = match:class ^(btop)$, center on

#configuration blueti in the terminal 
windowrule = match:class ^(bluetui)$, float on
windowrule = match:class ^(blueti)$, size 700 400
windowrule = match:class title:^(blueti)$, center on

